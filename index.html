<body>
<div class="wrap">

<div class="top"><b id="dd">D-0</b><span id="sub"></span></div>
<p class="kicker">2027년 4월 29일, 계좌를 열고 규칙대로 첫 매수를 하는 날. 그날 필요한 것만 거꾸로 골랐어요.<br>
<b>질문에 먼저 답을 정하고</b>, 확인은 그다음에. 못 하는 날은 그냥 닫으면 돼요 — 아무것도 기록되지 않아요.</p>

<section class="card" id="card" aria-live="polite"></section>

<div class="tally">
  <b id="n">0</b> <span>개 해냈어요</span>
  <details>
    <summary>해낸 것 보기</summary>
    <ol class="log" id="log"></ol>
  </details>
</div>

<p class="foot">하루 단위 칸은 없어요. 쉰 날은 기록되지 않고, 쌓이는 건 해낸 것뿐이에요.<br>
이 페이지는 공부용이며 특정 종목·자산의 매수·매도 권유가 아니에요. 세금과 가입 조건은 2026년 11월 기준이고 바뀔 수 있으니, 실제로 움직이기 전에 공식 안내를 확인하세요.</p>
</div>

 {p:"출발점",t:"일찍 시작한 10년 vs 늦게 시작한 30년",q:"A는 20~29살에 매년 100만 원씩 10번 넣고 멈췄어요. B는 30~59살에 매년 100만 원씩 30번 넣었어요. 둘 다 연 7%. 60살에 누가 더 많을까요?",

 {p:"리스크",t:"코인의 변동성",q:"BTC는 2021년 11월 고점에서 2022년 바닥까지 몇 % 떨어졌을까요?",
  c:"BTCUSD 주봉 → '측정' 도구로 고점에서 저점까지",s:"TradingView",
  w:"약 -77%예요. 2018년에도 80% 넘게 떨어졌어요.",
  m:"이 정도 변동성이면 같은 금액이라도 주식보다 훨씬 작게 담아야 전체 계좌가 버텨요. 4번 카드대로 -77%를 메우려면 +330% 넘게 필요해요. 33번의 '코인 비중 상한'이 이 숫자에서 나와요."},
 {p:"리스크",t:"한 번에 얼마나 살까",q:"전체 1,000만 원, 한 번 매매에서 잃어도 되는 돈은 전체의 1%. 손절을 매수가 -8%에 둔다면, 한 번에 얼마어치 살 수 있을까요?",
  c:"=10000000*1%/8%",s:"스프레드시트",
  w:"125만 원이에요. 손절에 걸려도 10만 원(1%)만 잃어요.",
  m:"'얼마 살까'를 감으로 정하지 않고, '얼마까지 잃을 수 있나'에서 거꾸로 계산하는 방법이에요(포지션 사이징). 손절폭이 넓을수록 적게, 좁을수록 많이 사게 돼요. 이 공식이 연속으로 틀려도 계좌를 살려 둬요 — 17번에서 왜 필요한지 나와요."},
 {p:"리스크",t:"승률이 낮아도 버는 구조",q:"승률 40%. 이기면 +15%, 지면 -5%. 이 방식으로 계속하면 벌까요 잃을까요?",
  c:"=40%*15%-60%*5%",s:"스프레드시트 (결과 칸을 % 서식으로)",
  w:"+3% — 한 번 매매할 때마다 평균 +3%예요.",
  m:"이걸 기대값이라고 해요. 승률만 보면 지는 게임 같지만, 이길 때 크게·질 때 작게 만들면 남아요. 반대로 승률 70%여도 질 때 크게 잃으면 망해요. 그래서 스윙 규칙의 핵심은 '맞히기'가 아니라, 손절은 짧게 수익은 길게 두는 손익비예요."},
 {p:"리스크",t:"연패는 정상이다",q:"승률 50%로 10번 매매하면, 그중 5연패 이상이 나올 확률은 얼마쯤일까요? 1%? 10%? 30%?",
  c:"동전을 10번 던져 가장 길게 이어진 '뒷면' 횟수를 적기\n이걸 5세트",s:"동전 + 노트",
  w:"5세트 중 한 번쯤 4~5연속이 나와도 이상하지 않아요.",
  m:"동전을 10번 던져 5번 이상 연속으로 같은 면이 나올 확률은 약 11%, 20번이면 약 25%예요. 실제 매매는 수십·수백 번이니 긴 연패는 '언젠가 반드시' 와요. 15번 공식대로 1%씩만 걸었다면 5연패도 약 -5%예요. 한 번에 20%씩 걸었다면 5연패에 계좌의 3분의 2가 사라져요(0.8을 다섯 번 곱하면 0.33)."},

 {p:"기업 읽기",t:"비싼 주식 = 큰 회사?",q:"주가가 50만 원인 회사와 5만 원인 회사, 어느 쪽이 더 큰 회사일까요?",
  c:"관심 기업 두 곳의 주가와 발행주식수를 찾아서\n주가 × 주식수 = 사이트에 나온 시가총액인지 계산",s:"브라우저(Yahoo Finance 등) + 계산기",
  w:"주가만으로는 알 수 없어요. 회사의 가격은 시가총액이에요.",
  m:"주가는 회사를 몇 조각으로 나눴느냐에 따라 달라져요. 같은 회사도 주식을 10조각으로 쪼개면(액면분할) 주가는 1/10이 되지만 회사 가치는 그대로예요. 회사끼리 크기를 비교할 땐 시가총액, 한 주가 싼지 비싼지는 23번(PER)으로 봐요."},
 {p:"기업 읽기",t:"매출에서 순이익까지",q:"매출이 늘면 순이익도 반드시 늘까요?",
  c:"Yahoo Finance → 관심 기업 → Financials → Income Statement\n매출 → 매출총이익 → 영업이익 → 순이익, 3년치 적기",s:"브라우저 + 노트",
  w:"단계마다 무엇이 빠지는지 옆에 한 단어씩 적어 보세요.",
  m:"매출에서 원가를 빼면 매출총이익, 거기서 인건비·광고비·연구비를 빼면 영업이익, 이자와 세금까지 빼면 순이익이에요. 매출이 늘어도 비용이 더 빨리 늘면 이익은 줄어요. '잘 팔고 있나'와 '잘 남기고 있나'는 다른 질문이에요."},
 {p:"기업 읽기",t:"얼마 남기며 파는가",q:"애플은 100원어치를 팔면 원가를 빼고 몇 원이 남을까요? 10원? 25원? 45원?",
  c:"19번 표에서 매출총이익 ÷ 매출",s:"계산기",
  w:"최근 회계연도 기준 46~47원 안팎이에요.",
  m:"이게 매출총이익률이에요. 같은 업종에서 이 비율이 꾸준히 높다는 건 비싸게 팔 수 있는 힘 — 브랜드, 기술, 독점 같은 '해자'가 있다는 신호예요. 한 해 숫자보다 몇 년 동안 유지되는지가 더 중요해요."},
 {p:"기업 읽기",t:"이익과 현금은 다르다",q:"순이익이 흑자인 회사는 통장의 현금도 늘었을까요?",
  c:"같은 회사 Cash Flow 탭 → 영업현금흐름과 순이익 비교\n잉여현금흐름 = 영업현금흐름 - 설비투자(Capital Expenditure)",s:"브라우저 + 계산기",
  w:"두 숫자가 꽤 달라요. 왜 다른지가 이 카드의 핵심이에요.",
  m:"회계는 '돈 받을 권리가 생긴 순간'을 매출로 잡아요(발생주의). 외상으로 팔아도 이익은 생기지만 현금은 아직 없어요. 이익은 큰데 현금이 계속 안 들어오는 회사는 위험 신호예요. 잉여현금흐름은 사업을 유지하고도 남는 진짜 여윳돈이에요."},
 {p:"기업 읽기",t:"빚은 무조건 나쁠까",q:"부채가 많은 회사는 무조건 위험할까요?",
  c:"Balance Sheet → 총부채(Total Liabilities), 자본(Stockholders' Equity)\n부채비율 = 부채 ÷ 자본",s:"브라우저 + 계산기",
  w:"숫자만 보지 말고, 21번의 현금흐름으로 그 빚을 감당할 수 있는지 같이 보세요.",
  m:"빚을 써서 사업을 키우면 잘될 때 수익이 커지고, 안될 때 손실도 커져요(레버리지). 현금이 꾸준히 들어오는 회사의 빚과 적자 회사의 빚은 같은 숫자여도 의미가 달라요. 금리가 오르면 이자 부담 때문에 빚 많은 회사가 먼저 흔들려요."},
 {p:"기업 읽기",t:"PER 10은 무조건 싸다?",q:"PER 30인 회사와 PER 10인 회사, 10이 무조건 싼 걸까요?",
  c:"관심 기업 주가 ÷ 주당순이익(EPS)을 직접 계산해서\n사이트에 나온 PER과 같은지 확인",s:"브라우저 + 계산기",
  w:"값이 다르면 어느 기간 EPS를 썼는지 보세요(최근 4분기 실적 vs 예상치).",
  m:"PER은 '지금 이익의 몇 년 치를 주고 사느냐'예요. 이익이 빠르게 늘 회사는 지금 PER이 높아도 몇 년 뒤엔 낮아질 수 있고, 이익이 줄 회사는 PER 10도 비싸요. 13번의 닷컴 버블은 이익이 뒷받침 안 된 PER의 결말이었어요. PER은 답이 아니라 '시장이 얼마나 기대하나'를 재는 자예요."},
 {p:"기업 읽기",t:"회사가 직접 쓴 위험 목록",q:"회사가 '우리 회사의 위험 요인'을 스스로 적어서 공개할까요?",
  c:"SEC EDGAR(sec.gov)에서 관심 기업 검색 → 최신 10-K\n→ Item 1A. Risk Factors 처음 세 개를 한 줄씩 요약",s:"브라우저 + 노트",
  w:"영어가 길면 AI에게 요약을 시키되, 원문 한 단락은 직접 읽고 요약과 대조하세요.",
  m:"미국 상장사는 매년 10-K라는 사업보고서를 의무로 공시하고, 알면서 숨기면 법적 책임을 져요. Item 1A에는 회사가 아는 위험이 적혀 있어요. 뉴스는 지난 일을 말하지만, 이 목록은 앞으로 무엇이 회사를 흔들 수 있는지를 회사 입으로 말해요."},

 {p:"차트와 규칙",t:"지지와 저항",q:"같은 가격대에서 세 번 반등한 주식, 네 번째도 반등할까요?",
  c:"SPY 일봉 → 최근 1년에서 여러 번 반등한 가격대에 가로선 긋기",s:"TradingView",
  w:"반등한 곳과 뚫고 내려간 곳을 둘 다 찾아보세요.",
  m:"사람들이 그 가격을 기억하고 근처에 매수 주문을 몰아 두기 때문에 반등이 잦아져요. 일종의 자기실현적 현상이에요. 하지만 보장은 아니고, 뚫리면 오히려 그 가격이 저항이 돼요. 그래서 지지선은 '사는 이유'보다 '틀렸을 때 나갈 자리(손절)'로 더 쓸모 있어요."},
 {p:"차트와 규칙",t:"200일 이동평균선",q:"주가가 200일 이동평균선 위에 있다는 건 무슨 뜻일까요?",
  c:"지표 → Moving Average, 길이 200\nSPY와 관심 종목에 적용해서 최근 1년의 위/아래 구간 보기",s:"TradingView",
  w:"12번의 2008년 구간에도 적용해 보세요.",
  m:"200일 이동평균은 최근 200거래일(약 10개월) 종가의 평균, 그 기간에 산 사람들의 대략적인 평균 단가예요. 주가가 그 위면 대부분이 수익 중이라 팔 압력이 적고, 아래면 대부분이 손실 중이에요. 그래서 '추세가 살아 있나'를 거르는 필터로 써요. 예측이 아니라 지금 상태의 요약이에요."},
 {p:"차트와 규칙",t:"거래량이 말해 주는 것",q:"가격은 오르는데 거래량이 계속 줄고 있다면, 좋은 신호일까요?",
  c:"거래량 지표를 켜고, 최근 급등 구간 하나에서\n오른 날 거래량이 평소보다 컸는지 보기",s:"TradingView",
  w:"돌파한 날 거래량이 평소보다 컸는지가 핵심이에요.",
  m:"거래량은 그 가격에 얼마나 많은 사람이 동의했는지예요. 큰 거래량과 함께 오르면 많은 돈이 들어왔다는 뜻이고, 적은 거래량으로 오르면 소수만 움직인 거라 쉽게 되돌아갈 수 있어요. 가격이 '무엇'이라면 거래량은 '얼마나 확신하나'예요."},
 {p:"차트와 규칙",t:"모의매매 첫 진입",q:"사기 전에 손절가를 정하지 않으면, 떨어질 때 무슨 일이 생길까요?",
  c:"페이퍼 트레이딩(가상 계좌)에서, 주문 전에 노트에 먼저:\n진입가, 손절가, 목표가, 15번 공식으로 계산한 수량, 산 이유\n→ 그다음에 주문",s:"TradingView + 노트",
  w:"순서가 핵심이에요. 노트 먼저, 주문은 나중.",
  m:"사고 나면 그 주식이 '내 것'이 돼서 판단이 흐려져요(보유 효과). 떨어지면 '곧 오르겠지', 더 떨어지면 '지금 팔면 손해 확정'이 되면서 작은 손실이 큰 손실로 자라요. 산 뒤의 나보다 사기 전의 내가 더 냉정해요. 그래서 나갈 자리를 들어가기 전에 정해요."},
 {p:"차트와 규칙",t:"매매 복기",q:"수익 난 매매는 다 잘한 매매일까요?",
  c:"모의매매 최소 3건을 노트에 2×2 표로 분류:\n규칙대로 했나(예/아니오) × 결과(수익/손실)",s:"노트",
  w:"'규칙을 어겼는데 수익'이 가장 위험한 칸이에요.",
  m:"결과와 결정을 떼어 봐야 배울 수 있어요. 규칙을 어기고 운으로 번 경험은 다음에 또 어기게 만들어요. 반대로 규칙대로 했는데 손실이면 실수가 아니라 비용이에요(17번처럼 연패는 정상). 복기는 '돈을 벌었나'가 아니라 '정한 대로 했나'를 보는 시간이에요."},
 {p:"차트와 규칙",t:"모의매매 성과를 숫자로",q:"모의매매 승률이 낮으면 그 방법은 버려야 할까요?",
  c:"매매일지 시트에서 승률, 평균 수익%, 평균 손실%를 구하고\n16번과 같은 수식으로 기대값 계산",s:"스프레드시트 (매매일지)",
  w:"10건 미만이면 숫자를 너무 믿지 마세요.",
  m:"16번에서 봤듯이 승률 하나로는 판단할 수 없어요. 기대값이 플러스면 승률이 낮아도 남는 방식이에요. 다만 몇 건 안 되는 기록은 운의 영향이 커서, '맞다'가 아니라 '아직은 이렇게 보인다' 정도로 읽어요."},

 {p:"코인",t:"비트코인은 누가 승인하나",q:"은행 없이 비트코인 송금이 진짜인지 누가 확인할까요?",
  c:"비트코인 백서(bitcoin.org/bitcoin.pdf, 한국어 번역본도 있음)\n초록과 1장만 읽기",s:"브라우저",
  w:"9쪽짜리예요. 오늘은 첫 페이지만.",
  m:"수많은 컴퓨터(채굴자)가 거래 묶음(블록)을 붙일 권리를 두고 계산 경쟁을 해요(작업증명). 이긴 쪽이 블록을 붙이고, 나머지는 규칙에 맞는지 검사해요. 과거 기록을 고치려면 그 뒤의 계산을 전부 다시 해야 해서 사실상 불가능해요. 신뢰를 기관 대신 계산 비용으로 만든 거예요."},
 {p:"코인",t:"거래소에 둔 코인은 내 것?",q:"거래소 앱에 보이는 내 코인, 거래소가 망하면 돌려받을 수 있을까요?",
  c:"'FTX 파산 고객 자산'을 검색해서 무슨 일이 있었는지 세 줄 요약",s:"브라우저 + 노트",
  w:"국내 거래소는 2024년부터 법으로 고객 예치금 분리 보관이 의무지만, 원리는 같으니 알아 두세요.",
  m:"거래소에 맡기면 실제 코인은 거래소 지갑에 있고, 앱에 보이는 건 '받을 권리'예요. 거래소가 고객 자산을 다른 데 쓰다 망하면 그 권리가 휴지가 될 수 있어요. 2022년 FTX가 그 사례예요. 'Not your keys, not your coins' — 열쇠(개인키)가 내게 없으면 내 코인이 아니라는 말이 여기서 나왔어요."},
 {p:"코인",t:"코인 보안 체크리스트",q:"시드 문구를 휴대폰 사진으로 찍어 클라우드에 두면 안전할까요?",
  c:"노트에 체크리스트:\n거래소 2단계 인증(OTP 앱), 출금 주소 등록 제한,\n시드 문구는 종이에만, 피싱 링크 구분법, 코인 비중 상한(%)",s:"노트",
  w:"지금 계좌가 없어도 4월 29일 가입 직후에 바로 쓸 목록이에요.",
  m:"시드 문구는 지갑 전체를 복원하는 마스터 열쇠라, 아는 사람이 곧 주인이에요. 클라우드·사진·메신저는 해킹되면 그대로 털려요. 코인은 한 번 보내면 되돌릴 방법이 없어서 보안 사고가 곧 영구 손실이에요. 14번의 변동성을 생각해 비중 상한도 여기 같이 적어요."},
 {p:"코인",t:"코인 세금, 지금 상태 확인",q:"2027년에 코인으로 번 돈에 세금이 붙을까요?",
  c:"'가상자산 과세 2027' 최신 뉴스와 국세청 안내 확인\n→ 시행 여부, 공제 금액, 세율 세 줄",s:"브라우저 + 노트",
  w:"제가 아는 건 '2027년 1월 시행 예정, 연 250만 원 공제 후 22%'까지예요. 여러 번 미뤄진 제도라 지금 상태는 직접 확인하세요.",
  m:"세금은 수익에서 바로 빠져서, 같은 수익이라도 손에 쥐는 돈이 달라져요. 그리고 법은 바뀌어요. 그래서 외워 두기보다 어디서 확인하는지 아는 게 중요해요. 이 카드의 진짜 목표는 국세청과 공식 발표를 찾아가는 길을 익히는 거예요."},

 {p:"4월 29일 준비",t:"증권사 고르기",q:"수수료가 제일 싼 증권사가 무조건 제일 좋을까요?",
  c:"증권사 2~3곳 비교표:\n해외주식 수수료, 환전 비용, 가입 절차, 예약·손절 주문 지원",s:"브라우저 + 노트",
  w:"11번에서 구한 왕복 비용으로 비교하세요. 이벤트 수수료는 기간이 끝나면 바뀌어요.",
  m:"비용은 매번 빠지니 중요하지만, 장기 보유가 중심이면 수수료보다 환전 비용과 앱에서 실수하지 않는 게 더 클 수 있어요. 손절 주문(스톱)을 걸 수 있는지도 보세요. 28번에서 정한 규칙을 실제로 걸 수 있어야 하니까요."},
 {p:"4월 29일 준비",t:"가입 조건과 순서",q:"4월 29일 당일에 증권 계좌와 코인 거래소를 둘 다 바로 만들 수 있을까요?",
  c:"쓸 증권사와 거래소의 가입 조건(나이, 본인 인증, 연결 은행 계좌) 확인\n→ 준비물과 순서 목록",s:"브라우저 + 노트",
  w:"거래소는 만 19세부터 가입되는 곳이 많아요. 연결 은행 계좌를 새로 만들어야 하면 며칠이 걸릴 수 있어요.",
  m:"국내 코인 거래소는 지정된 은행의 실명 계좌와 연결돼야 원화 입출금이 돼요. 은행 계좌를 새로 만들어야 하면 짧은 기간에 여러 계좌를 못 만드는 제한(흔히 20영업일)에 걸릴 수 있어서, 당일에 다 안 될 수 있어요. 순서를 미리 짜 두면 D-day가 덜 허둥대요."},
 {p:"4월 29일 준비",t:"규칙서 v1.0",q:"규칙서에 반드시 '숫자'로 들어가야 하는 항목은 뭘까요?",
  c:"노트에 규칙서:\n① 5번의 세 줄  ② 장기/스윙/코인 비중(%)\n③ 1회 최대 손실(15번)  ④ 진입·손절 조건(28번)\n⑤ 코인 상한·보안(33번)  ⑥ 연패하면 쉬는 규칙",s:"노트",
  w:"앞에서 만든 숫자를 모으는 카드예요. 새로 생각할 건 ⑥ 하나뿐.",
  m:"숫자가 없는 규칙은 어겨도 티가 안 나서 규칙이 아니에요. '조심해서 산다'는 규칙이 아니고 '1회 손실 전체의 1% 이하'는 규칙이에요. 이 문서가 4월 29일 이후 감정 대신 결정을 내려 줘요."},
 {p:"4월 29일 준비",t:"첫 달 계획",q:"4월 29일에 투자 가능 금액을 전부 넣어야 할까요?",
  c:"노트: 첫 달에 넣을 금액(3번 금액의 일부),\n첫 매수 후보(장기 ETF부터), 3개월 뒤 점검 날짜",s:"노트",
  w:"처음 3개월은 작은 돈으로 규칙이 실제로 지켜지는지 보는 기간이에요.",
  m:"모의매매와 실제 돈은 감정의 무게가 달라요. 가상의 -10%는 담담해도 실제 -10%는 손이 떨려요. 그래서 작게 시작해 규칙을 지킬 수 있는지 먼저 확인하고, 30번의 모의매매 성과와 비교한 뒤 늘려요. 4월 29일은 결승선이 아니라 출발선이에요."}
];
const END="2027-04-29", KEY="invq-v1";
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
// 완료한 카드는 done에, 남은 순서는 order에. 미루면 order 맨 뒤로 — 기록은 남지 않아요.
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&Array.isArray(s.done)&&Array.isArray(s.order))return s;}catch(e){}
  return {done:[],order:C.map((_,i)=>i)};
}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function complete(){const i=S.order.shift();if(i===undefined)return;S.done.push(i);save();render();}
function later(){if(S.order.length<2)return;S.order.push(S.order.shift());save();render();}
function render(){
  const days=Math.round((parse(END)-parse(iso(new Date())))/864e5), left=S.order.length;
  document.getElementById("dd").textContent=days>0?`D-${days}`:days===0?"D-DAY":"시작함";
  document.getElementById("sub").textContent=left===0?"카드를 다 끝냈어요"
    :days>=left?`남은 카드 ${left}장 · ${Math.floor(days/left)}일에 한 장이면 충분해요`:`남은 카드 ${left}장`;
  document.getElementById("n").textContent=S.done.length+1; // 9월의 6일을 1개로 인정
  const log=document.getElementById("log");log.innerHTML="";
  const li0=document.createElement("li");li0.textContent="9월에 6일 — 첫 주 세팅과 『돈의 심리학』 시작";log.appendChild(li0);
  S.done.forEach(i=>{const li=document.createElement("li");li.textContent=C[i].t;log.appendChild(li);});
  const card=document.getElementById("card"), i=S.order[0];
  if(i===undefined){card.innerHTML='<p class="empty">38장 전부 해냈어요.</p><p class="why">규칙서와 첫 달 계획이 손에 있어요. 4월 29일은 출발선이에요.</p>';return;}
  card.innerHTML='<p class="n"></p><p class="task"></p>'
    +'<span class="lbl">① 먼저 답을 정해 보세요</span><p class="q"></p>'
    +'<span class="lbl">② 직접 확인하기</span><span class="where"></span><code class="cmd"></code><p class="why"></p>'
    +'<span class="lbl">③ 왜 그런지 — 확인한 다음에 읽으세요</span><p class="mech"></p>'
    +'<div class="acts"><button class="btn go" id="ok">확인했어요</button><button class="btn ghost" id="lt">오늘은 말고</button></div>';
  const x=C[i];
  card.querySelector(".n").textContent=`${x.p} · ${i+1}번`;
  card.querySelector(".task").textContent=x.t;
  card.querySelector(".q").textContent=x.q;
  card.querySelector(".where").textContent="어디서: "+x.s;
  card.querySelector(".cmd").textContent=x.c;
  card.querySelector(".why").textContent=x.w;
  card.querySelector(".mech").textContent=x.m;
  document.getElementById("ok").onclick=complete;
  document.getElementById("lt").onclick=later;
}
render();

if(location.search==="?test"){ // 큐 동작과 카드 데이터 자체 점검
  const keep=S;S={done:[],order:[0,1,2]};
  complete();console.assert(S.done.join()==="0"&&S.order.join()==="1,2","완료 시 앞에서 빠져 done으로");
  later();console.assert(S.order.join()==="2,1"&&S.done.length===1,"미루면 맨 뒤로, 완료로 세지 않음");
  S={done:[],order:[0]};later();console.assert(S.order.join()==="0","마지막 한 장은 미뤄도 그대로");
  C.forEach((x,i)=>console.assert(x.p&&x.t&&x.q&&x.c&&x.s&&x.w&&x.m,"빈 칸 있는 카드: "+(i+1)));
  S=keep;render();console.log("self-check 끝");
}
</script>
